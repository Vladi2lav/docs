<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Учёт времени педагога</title>
  <style>body { font: 15px "Segoe UI", system-ui, sans-serif; margin: 40px; color: #1c2430; }</style>
</head>
<body>
  <!-- Корень сайта открывает стабильную версию из releases.json; ссылка с #ws=… сохраняет рабочую область -->
  <p id="msg">Открываю стабильную версию…</p>
  <script>
    fetch('releases.json', { cache: 'no-store' })
      .then(r => r.json())
      .then(({ stable }) => location.replace(`releases/${stable}/${location.hash}`))
      .catch(() => { document.getElementById('msg').textContent = 'Не удалось загрузить список версий (releases.json).'; });
  </script>
</body>
</html>
